name: Security patch checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [security/protect-parking-writes-20261121]
jobs:
  authorization-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/middleware/requireAdmin.js
      - run: node --check server/routes/api.js
      - run: node --test server/tests/requireAdmin.test.js
      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund
